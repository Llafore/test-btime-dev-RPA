[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-rpa"
version = "0.1.0"
description = "Coleta meteorológica, scraping x api"
requires-python = ">=3.11"
dependencies = [
    "tzdata; sys_platform == 'win32'",
    "beautifulsoup4>=4.12,<5",
]

[project.scripts]
weather-rpa = "weather_rpa.cli:main"
weather-api = "weather_rpa.cli:api_main"
weather-scraping = "weather_rpa.cli:scraping_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"weather_rpa.schemas" = ["*.json"]
"weather_rpa.config" = ["*.json"]
